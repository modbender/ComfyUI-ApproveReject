[project]
name = "comfyui-approvereject"
version = "0.1.1"
description = "An in-graph approve/reject gate node for ComfyUI — pause execution, preview the candidate, and on reject re-fire the upstream subgraph with a new seed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Anime" }]
keywords = ["comfyui", "human-in-the-loop", "approve-reject", "image-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Repository = "https://github.com/anime/ComfyUI-ApproveReject"
Issues = "https://github.com/anime/ComfyUI-ApproveReject/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-ApproveReject"
Icon = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
